name: Build Minecraft Add-on Opener

on:
  push:
    branches:
      - build/minecraft-addon-opener-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack project
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q minecraft-addon-opener-project.zip -d build-project

      - name: Build debug APK
        working-directory: build-project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare downloadable APK
        run: |
          cp build-project/app/build/outputs/apk/debug/app-debug.apk Minecraft-Addon-Helfer-v1.0.0.apk
          sha256sum Minecraft-Addon-Helfer-v1.0.0.apk | tee Minecraft-Addon-Helfer-v1.0.0.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Addon-Helfer-v1.0.0
          path: |
            Minecraft-Addon-Helfer-v1.0.0.apk
            Minecraft-Addon-Helfer-v1.0.0.sha256
            minecraft-addon-opener-project.zip
          if-no-files-found: error
          retention-days: 7
