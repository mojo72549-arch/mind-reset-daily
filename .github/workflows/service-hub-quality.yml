name: Service Hub Quality Gate

on:
  push:
    branches:
      - main
    paths:
      - 'service-hub/**'
      - '.github/workflows/service-hub-quality.yml'
  pull_request:
    paths:
      - 'service-hub/**'
      - '.github/workflows/service-hub-quality.yml'

permissions:
  contents: read

jobs:
  unit:
    name: Unit and syntax tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service-hub/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and document assets
        run: |
          test -s ../assets/rokatech-winser-logo.webp
          node --check ../app.js
          node --check ../core.js
          node --check ../ux-v5.js
          node --check ../ux-v6.js
          node --check ../ux-v6-context.js
          node --check ../ux-v6-admin-route.js
          node --check ../ux-v8-rapport.js
          node --check ../ux-v9-live-surface.js
          node --check ../ux-v9-dialogs.js
          node --check ../ux-v9-invoice-logo.js
          node --check ../ux-v9-dashboard.js
          node --check ../ux-v10-report-time.js
          node --check ../ux-v12-slim-start.js
          node --check ../ux-v14-state-safety.js
          node --check ../ux-v15-payments.js
          node --check ../ux-v17-report-document.js
          node --check ../ux-v18-report-native-pdf.js
          node --check ../ux-v19-report-native-actions.js
          node --check ../ux-v21-business-guards.js
          node --check ../ux-v22-dispatch-post-safe.js
          node --check ../auth-v7.js
          node --check browser.spec.cjs
          node --check rapport-v8.spec.cjs
          node --check order-live.spec.cjs
          node --check dialogs-v9-2.spec.cjs
          node --check invoice-logo-v9-3.spec.cjs
          node --check dashboard-v9-4.spec.cjs
          node --check customer-search-v10.spec.cjs
          node --check persistence-v14.spec.cjs
          node --check payments-v15.spec.cjs
          node --check responsive-v16.spec.cjs
          node --check report-document-v17.spec.cjs
          node --check report-native-pdf-v18.spec.cjs
          node --check critical-business-flows.spec.cjs
          node --check release-blockers.spec.cjs
          node --check auth.spec.cjs
          node --check business-guards.test.cjs
          node --check dispatch-post-safe.test.cjs
          node --check playwright.config.cjs
      - name: Unit tests
        run: node --test unit.test.cjs business-logic.test.cjs business-guards.test.cjs dispatch-post-safe.test.cjs stability-guard.test.cjs

  critical-business-gate:
    name: Critical Annette and Dome journeys
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service-hub/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: service-hub/tests/package.json
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run critical business journeys on mobile and desktop
        run: npx playwright test critical-business-flows.spec.cjs release-blockers.spec.cjs --config=playwright.config.cjs
      - name: Upload critical gate report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-hub-critical-business-gate-report
          path: service-hub/tests/playwright-report
          if-no-files-found: ignore

  frontend:
    name: Full mobile and desktop regression suite
    needs:
      - unit
      - critical-business-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service-hub/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: service-hub/tests/package.json
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run complete regression suite
        run: npx playwright test --config=playwright.config.cjs
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-hub-playwright-report
          path: service-hub/tests/playwright-report
          if-no-files-found: ignore
