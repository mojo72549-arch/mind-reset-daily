name: TAYVORIQ Public Telegram Music Review

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tayvoriq-public-telegram-music-review.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare_send or poll"
        required: true
        default: "poll"
        type: choice
        options: [prepare_send, poll]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

concurrency:
  group: tayvoriq-public-telegram-music-review
  cancel-in-progress: false

jobs:
  prepare-and-send:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare_send')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout review repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify Telegram configuration
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"

      - name: Create final music review
        id: build
        run: |
          set -euo pipefail
          SOURCE="tayvoriq/runs/30277119576/tayvoriq-review.mp4"
          test -s "$SOURCE"
          REVIEW_ID="${{ github.run_id }}"
          TARGET="tayvoriq/runs/public-music-review-${REVIEW_ID}"
          mkdir -p "$TARGET"

          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$SOURCE")"
          export DURATION TARGET
          python - <<'PY'
          import json
          import math
          import os
          import random
          import wave
          from array import array
          from pathlib import Path

          duration = float(os.environ["DURATION"])
          target = Path(os.environ["TARGET"])
          sample_rate = 44100
          frames = int(duration * sample_rate)
          fade_in = 1.8
          fade_out = 3.0
          rng = random.Random(72549)

          # Original, wordless documentary underscore: a restrained minor drone,
          # warm fifths and very slow motion. No third-party audio is used.
          frequencies = (73.42, 110.00, 146.83, 220.00)
          phases = [rng.random() * 2 * math.pi for _ in frequencies]
          pcm = array("h")
          for i in range(frames):
              t = i / sample_rate
              intro = min(1.0, t / fade_in)
              outro = min(1.0, max(0.0, duration - t) / fade_out)
              envelope = intro * outro
              breath = 0.72 + 0.18 * math.sin(2 * math.pi * 0.055 * t) + 0.10 * math.sin(2 * math.pi * 0.031 * t + 1.3)
              signal = 0.0
              for index, frequency in enumerate(frequencies):
                  weight = (0.40, 0.27, 0.20, 0.13)[index]
                  signal += weight * math.sin(2 * math.pi * frequency * t + phases[index])
              signal += 0.05 * math.sin(2 * math.pi * 36.71 * t)
              signal *= 0.32 * envelope * breath
              pcm.append(max(-32767, min(32767, int(signal * 32767))))

          bed = target / "tayvoriq_original_documentary_bed.wav"
          with wave.open(str(bed), "wb") as handle:
              handle.setnchannels(1)
              handle.setsampwidth(2)
              handle.setframerate(sample_rate)
              handle.writeframes(pcm.tobytes())

          report = {
              "passed": True,
              "source": "original_generated_tayvoriq_score",
              "third_party_music_used": False,
              "style": "subtle cinematic documentary ambient",
              "music_gain_db": -27.0,
              "narration_ducking": True,
              "fade_in_seconds": fade_in,
              "fade_out_seconds": fade_out,
              "duration_seconds": round(duration, 3),
              "youtube_safe": True,
              "tiktok_safe": True,
              "contract_version": "public-documentary-underscore-v1",
          }
          (target / "background_music_report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          FADE_OUT_START="$(python - <<PY
          print(max(0.0, float('$DURATION') - 3.0))
          PY
          )"
          ffmpeg -y -loglevel error \
            -i "$SOURCE" \
            -i "$TARGET/tayvoriq_original_documentary_bed.wav" \
            -filter_complex "[0:a]asplit=2[voice][control];[1:a]atrim=0:${DURATION},asetpts=N/SR/TB,volume=-27dB,afade=t=in:st=0:d=1.8,afade=t=out:st=${FADE_OUT_START}:d=3[music];[music][control]sidechaincompress=threshold=0.018:ratio=10:attack=18:release=420:makeup=1[ducked];[voice][ducked]amix=inputs=2:duration=first:dropout_transition=0:normalize=0,alimiter=limit=0.95[aout]" \
            -map 0:v:0 -map "[aout]" -c:v copy -c:a aac -b:a 192k -movflags +faststart -shortest \
            "$TARGET/short_youtube.mp4"
          cp "$TARGET/short_youtube.mp4" "$TARGET/short_tiktok.mp4"

          python - <<PY
          import json
          from pathlib import Path
          target = Path("$TARGET")
          review_id = "$REVIEW_ID"
          decision = {
              "review_id": review_id,
              "status": "PENDING_REVIEW",
              "source_review_id": "30277119576",
              "music_gate": "PASSED",
              "platform_upload_performed": False,
          }
          (target / "decision.json").write_text(json.dumps(decision, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (target / "tiktok_caption.txt").write_text(
              "Waldbrandgefahr ernst nehmen: Warnungen prüfen, Abstand halten und im Notfall 112 rufen. #Waldbrand #Brandschutz #112 #TAYVORIQ\n",
              encoding="utf-8",
          )
          PY

          cat > "$TARGET/index.html" <<'HTML'
          <!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAYVORIQ Musik-Review</title><style>body{margin:0;background:#080b11;color:#f5f7fb;font-family:system-ui,sans-serif}main{max-width:620px;margin:auto;padding:22px}video{width:100%;max-height:78vh;background:#000;border-radius:20px}h1{font-size:1.45rem}.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#183a24;color:#bdf7cb;font-weight:800}.card{margin-top:16px;padding:15px;border:1px solid #303746;border-radius:14px;background:#111620;line-height:1.55}a{color:#8fc8ff}</style></head><body><main><span class="badge">Musik-Gate bestanden · Noch nicht veröffentlicht</span><h1>TAYVORIQ Waldbrand-Video mit Hintergrundmusik</h1><video controls playsinline preload="metadata" src="short_youtube.mp4"></video><div class="card"><strong>Finale Kontrolle</strong><p>Bild und Erzählerstimme entsprechen der bereits positiv bewerteten Fassung. Ergänzt wurde eine dezente, automatisch unter der Stimme abgesenkte Dokumentar-Hintergrundmusik.</p><p>Entscheide danach direkt in Telegram mit <strong>Freigeben</strong> oder <strong>Ablehnen</strong>.</p></div><p><a href="short_youtube.mp4">Video direkt öffnen</a> · <a href="tiktok_caption.txt">TikTok-Caption</a></p></main></body></html>
          HTML

          rm -rf tayvoriq/latest
          mkdir -p tayvoriq/latest
          cp -a "$TARGET/." tayvoriq/latest/
          echo "review_id=$REVIEW_ID" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Commit final review page
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tayvoriq
          git commit -m "Publish TAYVORIQ Telegram music review ${{ steps.build.outputs.review_id }}"
          git pull --rebase origin main
          git push origin main

      - name: Send Telegram approval controls
        env:
          REVIEW_ID: ${{ steps.build.outputs.review_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          review_id = os.environ["REVIEW_ID"].strip()
          review_url = f"https://mojo72549-arch.github.io/mind-reset-daily/tayvoriq/runs/public-music-review-{review_id}/"
          payload = {
              "chat_id": chat_id,
              "text": (
                  "🟢 Dein TAYVORIQ-Video mit Hintergrundmusik ist bereit\n\n"
                  "Die Musik wurde dezent unter die Erzählerstimme gelegt und das Musik-Gate wurde bestanden. "
                  "Öffne das Video und entscheide danach direkt mit Freigeben oder Ablehnen.\n\n"
                  "Noch nicht veröffentlicht."
              ),
              "disable_web_page_preview": False,
              "reply_markup": {
                  "inline_keyboard": [
                      [{"text": "🎬 Review öffnen", "url": review_url}],
                      [
                          {"text": "✅ Freigeben", "callback_data": f"tayvoriq-public:approve:{review_id}"},
                          {"text": "❌ Ablehnen", "callback_data": f"tayvoriq-public:reject:{review_id}"},
                      ],
                  ]
              },
          }
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise SystemExit(result)
          print("Telegram delivered, message_id=", result["result"].get("message_id"))
          PY

  poll-approval:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'poll')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout decision state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Telegram configuration
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"

      - name: Process Telegram decision
        id: poll
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          configured_chat = os.environ["TELEGRAM_CHAT_ID"].strip()
          state_path = Path(".automation/tayvoriq-public-telegram-state.json")
          state = {"next_update_id": 0, "decisions": {}}
          if state_path.exists():
              try:
                  state.update(json.loads(state_path.read_text(encoding="utf-8")))
              except Exception:
                  pass

          def call(method, payload):
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(result)
              return result.get("result")

          updates = call("getUpdates", {
              "offset": int(state.get("next_update_id") or 0),
              "limit": 100,
              "timeout": 0,
              "allowed_updates": ["callback_query"],
          }) or []
          changed = False
          pattern = re.compile(r"^tayvoriq-public:(approve|reject):([0-9]{6,})$")

          for update in updates:
              state["next_update_id"] = max(int(state.get("next_update_id") or 0), int(update.get("update_id") or 0) + 1)
              callback = update.get("callback_query") or {}
              data = str(callback.get("data") or "")
              match = pattern.fullmatch(data)
              if not match:
                  continue
              action, review_id = match.groups()
              message = callback.get("message") or {}
              chat_id = str((message.get("chat") or {}).get("id") or "")
              callback_id = str(callback.get("id") or "")
              message_id = int(message.get("message_id") or 0)
              if chat_id != configured_chat:
                  call("answerCallbackQuery", {"callback_query_id": callback_id, "text": "Nicht autorisierter Chat.", "show_alert": True})
                  continue

              final_status = "APPROVED" if action == "approve" else "REJECTED"
              previous = (state.get("decisions") or {}).get(review_id) or {}
              if previous.get("status") in {"APPROVED", "REJECTED"}:
                  call("answerCallbackQuery", {"callback_query_id": callback_id, "text": "Review wurde bereits verarbeitet."})
                  continue

              decision_path = Path(f"tayvoriq/runs/public-music-review-{review_id}/decision.json")
              if not decision_path.exists():
                  call("answerCallbackQuery", {"callback_query_id": callback_id, "text": "Review-Datei nicht gefunden.", "show_alert": True})
                  continue

              decision = json.loads(decision_path.read_text(encoding="utf-8"))
              decision.update({
                  "status": final_status,
                  "processed_at": datetime.now(timezone.utc).isoformat(),
                  "source": "telegram_callback_public_fallback",
                  "publication_pending_actions_capacity": final_status == "APPROVED",
              })
              decision_path.write_text(json.dumps(decision, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              state.setdefault("decisions", {})[review_id] = decision
              changed = True

              call("answerCallbackQuery", {
                  "callback_query_id": callback_id,
                  "text": "Freigabe gespeichert." if final_status == "APPROVED" else "Review abgelehnt.",
              })
              if message_id:
                  call("editMessageReplyMarkup", {
                      "chat_id": chat_id,
                      "message_id": message_id,
                      "reply_markup": {"inline_keyboard": []},
                  })
              confirmation = (
                  f"✅ TAYVORIQ Review {review_id} freigegeben.\n\nDie Entscheidung wurde gespeichert. "
                  "Der Plattform-Upload bleibt bis zur Wiederherstellung der privaten GitHub-Actions-Kapazität gesperrt."
                  if final_status == "APPROVED"
                  else f"❌ TAYVORIQ Review {review_id} abgelehnt. Es wird nichts veröffentlicht."
              )
              call("sendMessage", {"chat_id": configured_chat, "text": confirmation})

          if changed or not state_path.exists():
              state_path.parent.mkdir(parents=True, exist_ok=True)
              state["last_checked_at"] = datetime.now(timezone.utc).isoformat()
              state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("changed=", changed)
          PY

      - name: Commit decision state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation tayvoriq/runs/public-music-review-*/decision.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new Telegram decision."
            exit 0
          fi
          git commit -m "Record TAYVORIQ public Telegram decision"
          git pull --rebase origin main
          git push origin main
