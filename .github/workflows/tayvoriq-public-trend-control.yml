name: TAYVORIQ Public Trend Control

on:
  push:
    branches: [main]
    paths:
      - .automation/tayvoriq-public-trend-request.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tayvoriq-public-trend-control
  cancel-in-progress: false

jobs:
  deliver-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deliver current public trend selection through Control Center relay
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error             "https://tayvoriq-control-center-mo61.vercel.app/api/health?telegram=send")"
          echo "$response"
          python - <<'PY' "$response"
          import json
          import sys

          payload = json.loads(sys.argv[1])
          if payload.get("ok") is not True:
              raise SystemExit(payload)
          if not payload.get("session_id"):
              raise SystemExit("Relay response is missing session_id")
          print({
              "telegram_selection_delivery": "confirmed",
              "session_id": payload["session_id"],
              "message_id": payload.get("message_id"),
              "already_sent": bool(payload.get("already_sent")),
          })
          PY
