name: TAYVORIQ Public Trend Control

on:
  push:
    branches: [main]
    paths:
      - .automation/tayvoriq-public-trend-request.json
  workflow_dispatch:
    inputs:
      mode:
        description: "send or poll"
        required: true
        default: "poll"
        type: choice
        options: [send, poll]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

concurrency:
  group: tayvoriq-public-trend-control
  cancel-in-progress: false

jobs:
  send-trends:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'send')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Send five trends to Telegram
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          request_path = Path('.automation/tayvoriq-public-trend-request.json')
          state_path = Path('.automation/tayvoriq-public-trend-state.json')
          req = json.loads(request_path.read_text(encoding='utf-8'))
          candidates = req.get('candidates') or []
          if len(candidates) != 5:
              raise SystemExit('Exactly five trends required')
          session_id = str(req['session_id'])
          token = os.environ['TELEGRAM_BOT_TOKEN'].strip()
          chat_id = os.environ['TELEGRAM_CHAT_ID'].strip()

          lines = ['🔥 TAYVORIQ · Trendauswahl', '']
          for i, candidate in enumerate(candidates, 1):
              lines.append(f"{i}️⃣ {candidate['topic']}")
              series = str(candidate.get('series') or '').strip()
              follow_reason = str(candidate.get('follow_reason') or '').strip()
              if series:
                  lines.append(f"Serie: {series}")
              if follow_reason:
                  lines.append(f"Warum folgen: {follow_reason}")
              lines.append('')
          lines += ['Wähle einen Trend über die Buttons.', '✅ Trend freigeben startet genau diesen Auftrag.', '❌ Auswahl ablehnen startet nichts.']
          keyboard = {
              'inline_keyboard': [
                  [{'text': str(i), 'callback_data': f'tayvoriq-trend:toggle:{session_id}:{i}'} for i in range(1, 6)],
                  [
                      {'text': '✅ Trend freigeben', 'callback_data': f'tayvoriq-trend:approve:{session_id}'},
                      {'text': '✏️ Auswahl ändern', 'callback_data': f'tayvoriq-trend:reset:{session_id}'},
                  ],
                  [
                      {'text': '❌ Auswahl ablehnen', 'callback_data': f'tayvoriq-trend:reject:{session_id}'},
                  ],
              ]
          }
          payload = {'chat_id': chat_id, 'text': '\n'.join(lines), 'reply_markup': keyboard}
          request = urllib.request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=json.dumps(payload, ensure_ascii=False).encode('utf-8'),
              headers={'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode('utf-8'))
          if not result.get('ok'):
              raise SystemExit(result)
          message_id = int(result['result']['message_id'])
          state_path.parent.mkdir(parents=True, exist_ok=True)
          state = {
              'session_id': session_id,
              'status': 'PENDING',
              'selected': [],
              'candidates': candidates,
              'message_id': message_id,
              'next_update_id': 0,
              'notified_at': datetime.now(timezone.utc).isoformat(),
          }
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Telegram delivered: message_id={message_id}')
          PY

      - name: Save Telegram delivery state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation/tayvoriq-public-trend-state.json .automation/tayvoriq-public-production-request.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Record TAYVORIQ Telegram trend delivery"
            git pull --rebase origin main
            git push origin main
          fi

  poll-trends:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'poll')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Process Telegram trend controls
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          python - <<'PY'
          import json, os, re, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('.automation/tayvoriq-public-trend-state.json')
          if not path.exists():
              raise SystemExit(0)
          state = json.loads(path.read_text(encoding='utf-8'))
          if state.get('status') not in {'PENDING', 'APPROVED', 'REJECTED'}:
              raise SystemExit(0)
          if state.get('status') == 'REJECTED':
              raise SystemExit(0)
          token = os.environ['TELEGRAM_BOT_TOKEN'].strip()
          configured_chat = os.environ['TELEGRAM_CHAT_ID'].strip()
          session_id = str(state['session_id'])

          def call(method, payload):
              req = urllib.request.Request(
                  f'https://api.telegram.org/bot{token}/{method}',
                  data=json.dumps(payload, ensure_ascii=False).encode('utf-8'),
                  headers={'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.loads(response.read().decode('utf-8'))
              if not data.get('ok'):
                  raise RuntimeError(data)
              return data.get('result')

          def text():
              selected = set(int(x) for x in state.get('selected', []))
              lines = ['🔥 TAYVORIQ · Trendauswahl', '']
              for i, candidate in enumerate(state['candidates'], 1):
                  mark = '✅' if i in selected else f'{i}️⃣'
                  lines.append(f"{mark} {candidate['topic']}")
                  series = str(candidate.get('series') or '').strip()
                  follow_reason = str(candidate.get('follow_reason') or '').strip()
                  if series:
                      lines.append(f"Serie: {series}")
                  if follow_reason:
                      lines.append(f"Warum folgen: {follow_reason}")
                  lines.append('')
              chosen = ', '.join(str(x) for x in sorted(selected)) if selected else 'noch nichts'
              lines += [f'Ausgewählt: {chosen}', '', '✅ Freigeben startet den gewählten Auftrag.', '❌ Ablehnen startet nichts.']
              return '\n'.join(lines)

          def keyboard():
              selected = set(int(x) for x in state.get('selected', []))
              return {'inline_keyboard': [
                  [{'text': f'✅ {i}' if i in selected else str(i), 'callback_data': f'tayvoriq-trend:toggle:{session_id}:{i}'} for i in range(1, 6)],
                  [
                      {'text':'✅ Trend freigeben','callback_data':f'tayvoriq-trend:approve:{session_id}'},
                      {'text':'✏️ Auswahl ändern','callback_data':f'tayvoriq-trend:reset:{session_id}'},
                  ],
                  [
                      {'text':'❌ Auswahl ablehnen','callback_data':f'tayvoriq-trend:reject:{session_id}'},
                  ],
              ]}

          updates = call('getUpdates', {
              'offset': int(state.get('next_update_id') or 0), 'limit': 100, 'timeout': 0,
              'allowed_updates': ['callback_query']}) or []
          changed = False
          pattern = re.compile(r'^tayvoriq-trend:(toggle|approve|reset|reject):([A-Za-z0-9_-]+)(?::([1-5]))?
          for update in updates:
              state['next_update_id'] = max(int(state.get('next_update_id') or 0), int(update.get('update_id') or 0) + 1)
              changed = True
              cb = update.get('callback_query') or {}
              match = pattern.fullmatch(str(cb.get('data') or ''))
              if not match:
                  continue
              action, cb_session, number = match.groups()
              msg = cb.get('message') or {}
              chat_id = str((msg.get('chat') or {}).get('id') or '')
              if chat_id != configured_chat or cb_session != session_id:
                  continue
              cb_id = str(cb.get('id') or '')
              message_id = int(msg.get('message_id') or state.get('message_id') or 0)
              if state.get('status') == 'APPROVED':
                  call('answerCallbackQuery', {'callback_query_id': cb_id, 'text': 'Trend bereits freigegeben.'})
                  continue
              if action == 'toggle':
                  selected = set(int(x) for x in state.get('selected', []))
                  n = int(number)
                  if n in selected: selected.remove(n)
                  else: selected.add(n)
                  state['selected'] = sorted(selected)
                  state['updated_at'] = datetime.now(timezone.utc).isoformat()
                  changed = True
                  call('editMessageText', {'chat_id': configured_chat, 'message_id': message_id, 'text': text(), 'reply_markup': keyboard()})
                  call('answerCallbackQuery', {'callback_query_id': cb_id, 'text': 'Auswahl aktualisiert.'})
              elif action == 'reset':
                  state['selected'] = []
                  state['updated_at'] = datetime.now(timezone.utc).isoformat()
                  changed = True
                  call('editMessageText', {'chat_id': configured_chat, 'message_id': message_id, 'text': text(), 'reply_markup': keyboard()})
                  call('answerCallbackQuery', {'callback_query_id': cb_id, 'text': 'Auswahl zurückgesetzt.'})
              elif action == 'approve':
                  if not state.get('selected'):
                      call('answerCallbackQuery', {'callback_query_id': cb_id, 'text': 'Bitte zuerst einen Trend auswählen.', 'show_alert': True})
                      continue
                  selected_numbers = sorted(set(int(x) for x in state.get('selected', [])))
                  selected_candidates = [
                      dict(state['candidates'][number - 1])
                      for number in selected_numbers
                  ]
                  state['status'] = 'APPROVED'
                  state['approved_at'] = datetime.now(timezone.utc).isoformat()
                  state['production_dispatch_status'] = 'PENDING_PUBLIC_PRODUCTION'
                  request = {
                      'request_id': f"{session_id}-approved",
                      'source_session_id': session_id,
                      'status': 'APPROVED',
                      'approved_at': state['approved_at'],
                      'selected_numbers': selected_numbers,
                      'candidates': selected_candidates,
                      'language': 'Deutsch',
                      'platform': 'youtube_tiktok',
                      'target_duration': 40,
                      'publication_requires_telegram_review': True,
                      'follow_conversion_gate_required': True,
                      'quality_gates_weakened': False,
                  }
                  production_path = Path('.automation/tayvoriq-public-production-request.json')
                  production_path.write_text(json.dumps(request, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
                  changed = True
                  call('editMessageText', {'chat_id': configured_chat, 'message_id': message_id, 'text': text() + '\n\n✅ Trend freigegeben. Produktionsauftrag wurde gebunden.', 'reply_markup': {'inline_keyboard': []}})
                  call('answerCallbackQuery', {'callback_query_id': cb_id, 'text': 'Trend freigegeben.'})
              elif action == 'reject':
                  state['status'] = 'REJECTED'
                  state['rejected_at'] = datetime.now(timezone.utc).isoformat()
                  state['production_dispatch_status'] = 'BLOCKED_BY_USER'
                  state['selected'] = []
                  changed = True
                  call('editMessageText', {'chat_id': configured_chat, 'message_id': message_id, 'text': '❌ TAYVORIQ · Auswahl abgelehnt\n\nEs wurde kein Produktionsauftrag erstellt.', 'reply_markup': {'inline_keyboard': []}})
                  call('answerCallbackQuery', {'callback_query_id': cb_id, 'text': 'Auswahl abgelehnt. Es startet nichts.'})
          if changed:
              path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Save Telegram control state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation/tayvoriq-public-trend-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update TAYVORIQ public trend control state"
            git pull --rebase origin main
            git push origin main
          fi
)
          for update in updates:
              state['next_update_id'] = max(int(state.get('next_update_id') or 0), int(update.get('update_id') or 0) + 1)
              changed = True
              cb = update.get('callback_query') or {}
              match = pattern.fullmatch(str(cb.get('data') or ''))
              if not match:
                  continue
              action, cb_session, number = match.groups()
              msg = cb.get('message') or {}
              chat_id = str((msg.get('chat') or {}).get('id') or '')
              if chat_id != configured_chat or cb_session != session_id:
                  continue
              cb_id = str(cb.get('id') or '')
              message_id = int(msg.get('message_id') or state.get('message_id') or 0)
              if state.get('status') == 'APPROVED':
                  call('answerCallbackQuery', {'callback_query_id': cb_id, 'text': 'Trend bereits freigegeben.'})
                  continue
              if action == 'toggle':
                  selected = set(int(x) for x in state.get('selected', []))
                  n = int(number)
                  if n in selected: selected.remove(n)
                  else: selected.add(n)
                  state['selected'] = sorted(selected)
                  state['updated_at'] = datetime.now(timezone.utc).isoformat()
                  changed = True
                  call('editMessageText', {'chat_id': configured_chat, 'message_id': message_id, 'text': text(), 'reply_markup': keyboard()})
                  call('answerCallbackQuery', {'callback_query_id': cb_id, 'text': 'Auswahl aktualisiert.'})
              elif action == 'reset':
                  state['selected'] = []
                  state['updated_at'] = datetime.now(timezone.utc).isoformat()
                  changed = True
                  call('editMessageText', {'chat_id': configured_chat, 'message_id': message_id, 'text': text(), 'reply_markup': keyboard()})
                  call('answerCallbackQuery', {'callback_query_id': cb_id, 'text': 'Auswahl zurückgesetzt.'})
              elif action == 'approve':
                  if not state.get('selected'):
                      call('answerCallbackQuery', {'callback_query_id': cb_id, 'text': 'Bitte zuerst einen Trend auswählen.', 'show_alert': True})
                      continue
                  state['status'] = 'APPROVED'
                  state['approved_at'] = datetime.now(timezone.utc).isoformat()
                  state['production_dispatch_status'] = 'PENDING_PRIVATE_ORCHESTRATOR'
                  changed = True
                  call('editMessageText', {'chat_id': configured_chat, 'message_id': message_id, 'text': text() + '\n\n✅ Trend freigegeben.', 'reply_markup': {'inline_keyboard': []}})
                  call('answerCallbackQuery', {'callback_query_id': cb_id, 'text': 'Trend freigegeben.'})
          if changed:
              path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Save Telegram control state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation/tayvoriq-public-trend-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update TAYVORIQ public trend control state"
            git pull --rebase origin main
            git push origin main
          fi
