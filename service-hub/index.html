r(--l);text-align:left}.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(145deg,#081827,#173e62)}.loginbox{width:min(480px,100%);background:#fff;border-radius:22px;padding:25px}.sig{height:145px;width:100%;border:2px dashed #b8c6d2;border-radius:11px;touch-action:none}.sticky{position:sticky;bottom:10px;background:#fff;border:1px solid var(--l);border-radius:14px;padding:10px;box-shadow:0 8px 25px #0013}.mobile{display:none}.toast{position:fixed;right:15px;bottom:15px;background:#122333;color:#fff;padding:11px 14px;border-radius:10px;z-index:99}@media(max-width:850px){.g2,.g3{grid-template-columns:1fr}.shell{padding:12px 12px 78px}.desktop{display:none}.mobile{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--n);padding:7px;justify-content:space-around;z-index:10}.mobile button{background:none;border:0;color:#fff}.table table{min-width:650px}}@media print{.top,.mobile,.btn,.no-print{display:none!important}.shell{padding:0}.card{box-shadow:none}}</style></head><body><div id="app">Lade Service Hub Pro…</div><script>(function(){var PASS='Demo-2026!',S='shp_db',app=document.getElementById('app'),tab='home',selC=null,selO=null,selI=null,session=null;var catalog=[['Gerätewageneinsatz (inkl. 1 Techniker)','Std.',125],['2. Techniker','Std.',80],['Einsatz Hochdruckspüler (je angefangene Std)','Std.',90],['TV- Kanaluntersuchung (je angefangene Std)','Std.',80],['TV- Kanaluntersuchung inkl. Kanalortung (je angefangene Std)','Std.',120],['Aufzeichnung der TV- Kanaluntersuchung (USB Stick)','Stk.',45],['Notdienstzulage 75% (Mo-Fr 18-8 Uhr, Samstag ganztägig)','Std.',93.75],['Notdienstzulage 100% (Sonn-/Feiertag)','Std.',125],['Anfahrt','Psch',20],['Verbrauchsmaterialien','Psch',0]];var seed={customers:[{id:1,name:'Musterkunde Stuttgart GmbH',contact:'Thomas Berger',phone:'0711 555123',email:'t.berger@example.de',address:'Industriestraße 18, 70469 Stuttgart',rate:72,channel:'WhatsApp'}],orders:[{id:101,no:'A-2026-0101',customerId:1,title:'Wartung Heizungsanlage',type:'Wartung',date:'08.08.2026',status:'Zugewiesen',assignedTo:'Dome'}],reports:[{id:501,orderId:101,status:'Entwurf',start:'',end:'',work:'',result:'',lines:[],materials:[],customerName:'Thomas Berger',sigC:'',sigT:'',sent:''}],invoices:[{id:801,no:'26175',customerId:1,orderId:101,reportId:null,items:[{name:'Gerätewageneinsatz (inkl. 1 Techniker)',qty:1,unit:'Std.',price:125},{name:'Anfahrt',qty:1,unit:'Psch',price:20}],net:145,vat:27.55,gross:172.55,date:'26.05.2026',due:'26.06.2026',status:'Offen',history:[]}],settings:{vat:19,paymentDays:30,catalog:[]}};function clone(x){return JSON.parse(JSON.stringify(x))}function load(){var d=null;try{d=JSON.parse(localStorage.getItem(S)||'null')}catch(e){}if(!d||!d.customers)d=clone(seed);if(!d.reports&&d.protocols)d.reports=d.protocols;if(!d.reports)d.reports=[];if(!d.settings)d.settings={};if(!d.settings.catalog||!d.settings.catalog.length)d.settings.catalog=catalog.map(function(x,n){return{id:'s'+n,name:x[0],unit:x[1],price:x[2],active:true}});if(!d.settings.vat)d.settings.vat=19;if(!d.settings.paymentDays)d.settings.paymentDays=30;d.customers.forEach(function(c){if(!c.channel)c.channel=c.preferredChannel||'E-Mail'});d.invoices.forEach(function(i,n){if(!/^26\d{3}$/.test(String(i.no||'')))i.no=String(26175+n*5);if(!i.history)i.history=[];if(!i.items)i.items=[];if(i.gross==null)i.gross=+i.amount||0;if(i.net==null)i.net=+(i.gross/1.19).toFixed(2);if(i.vat==null)i.vat=+(i.gross-i.net).toFixed(2)});return d}var db=load();function save(){localStorage.setItem(S,JSON.stringify(db))}function q(s){return document.querySelector(s)}function money(v){return(+v||0).toFixed(2).replace('.',',')+' €'}function toast(t){var e=document.createElement('div');e.className='toast';e.innerHTML=t;document.body.appendChild(e);setTimeout(function(){e.parentNode.removeChild(e)},1600)}function cust(id){for(var i=0;i<db.customers.length;i++)if(db.customers[i].id==id)return db.customers[i]}function ord(id){for(var i=0;i<db.orders.length;i++)if(db.orders[i].id==id)return db.orders[i]}function repByOrder(id){for(var i=0;i<db.reports.length;i++)if(db.reports[i].orderId==id)return db.reports[i];var c=cust(ord(id).customerId),r={id:Date.now(),orderId:id,status:'Entwurf',start:'',end:'',work:'',result:'',lines:[],materials:[],customerName:c.contact||c.name,sigC:'',sigT:'',sent:''};db.reports.push(r);save();return r}function badge(s){var c=/bezahlt|abgeschlossen|erledigt/i.test(s)?'ok':/überfällig|storniert/i.test(s)?'bad':'warn';return'<span class="badge '+c+'">'+s+'</span>'}function nextInv(){var m=26170;db.invoices.forEach(function(i){var n=parseInt(i.no,10);if(n>m)m=n});return String(m+5)}function login(){var p=new URLSearchParams(location.search),u=p.get('role')==='dome'?'dome':p.get('role')==='annette'?'annette':'';app.innerHTML='<div class="login"><div class="loginbox"><h1>Service Hub Pro</h1><p class="muted">Rohr- & Kanaltechnik Winser</p><div class="field"><label>Benutzer</label><input id="u" value="'+u+'"></div><div class="field"><label>Passwort</label><input id="p" type="password" value="'+(u?PASS:'')+'"></div><button class="btn primary" style="width:100%" onclick="SH.login()">Anmelden</button><p class="muted">dome / annette / admin · Demo-2026!</p></div></div>'}function doLogin(){var u=q('#u').value.toLowerCase();if(['dome','annette','admin'].indexOf(u)<0||q('#p').value!==PASS)return toast('Zugangsdaten prüfen');session={user:u,role:u==='dome'?'tech':u==='admin'?'admin':'office'};sessionStorage.setItem('shp_session',JSON.stringify(session));render()}function logout(){sessionStorage.removeItem('shp_session');session=null;render()}function frame(x){var office=session.role!=='tech',nav=office?'<button class="btn" onclick="SH.go(\'home\')">Übersicht</button><button class="btn" onclick="SH.go(\'customers\')">Kunden</button><button class="btn" onclick="SH.go(\'orders\')">Aufträge</button><button class="btn" onclick="SH.go(\'reports\')">Rapporte</button><button class="btn" onclick="SH.go(\'invoices\')">Rechnungen</button>'+(session.role==='admin'?'<button class="btn" onclick="SH.go(\'admin\')">Administration</button>':''):'<button class="btn" onclick="SH.go(\'home\')">Meine Einsätze</button>';app.innerHTML='<header class="top"><div><div class="brand">Service Hub Pro</div><small>'+(session.user==='dome'?'Dome · Techniker':session.user==='annette'?'Annette · Büro':'Administration')+'</small></div><div class="nav desktop">'+nav+'<button class="btn" onclick="SH.logout()">Abmelden</button></div></header><main class="shell">'+x+'</main><nav class="mobile"><button onclick="SH.go(\'home\')">⌂<br>Start</button>'+(office?'<button onclick="SH.go(\'customers\')">👤<br>Kunden</button><button onclick="SH.go(\'reports\')">✓<br>Rapporte</button><button onclick="SH.go(\'invoices\')">€<br>Rechnungen</button>':'')+'<button onclick="SH.logout()">↪<br>Logout</button></nav>'}function home(){if(session.role==='tech'){return'<h2>Meine Einsätze</h2>'+db.orders.filter(function(o){return o.assignedTo==='Dome'}).map(function(o){var c=cust(o.customerId);return'<div class="card"><div class="row" style="justify-content:space-between"><div><b>'+o.no+' · '+o.title+'</b><p class="muted">'+c.name+'<br>'+c.address+'<br>'+o.date+'</p></div><div>'+badge(o.status)+'<br><button class="btn primary" onclick="SH.openReport('+o.id+')">Rapport öffnen</button></div></div></div>'}).join('')}return'<h2>Büro-Dashboard</h2><div class="grid g3"><div class="card metric"><span>Kunden</span><b>'+db.customers.length+'</b></div><div class="card metric"><span>Aufträge</span><b>'+db.orders.length+'</b></div><div class="card metric"><span>Rechnungen</span><b>'+db.invoices.length+'</b></div></div>'}function customers(){return'<div class="row" style="justify-content:space-between"><h2>Kunden</h2><button class="btn primary" onclick="SH.newCustomer()">+ Kunde</button></div>'+db.customers.map(function(c){return'<div class="card"><div class="row" style="justify-content:space-between"><div><b>'+c.name+'</b><p>'+c.contact+' · '+c.phone+'<br>'+c.email+'<br>'+c.address+'<br>Bevorzugt: <b>'+c.channel+'</b></p></div><div><button class="btn primary" onclick="SH.openCustomer('+c.id+')">360° öffnen</button></div></div></div>'}).join('')}function newCustomer(){var n=prompt('Kundenname');if(!n)return;var a=prompt('Adresse');if(!a)return;db.customers.push({id:Date.now(),name:n,contact:prompt('Ansprechpartner')||'',phone:prompt('Telefon')||'',email:prompt('E-Mail')||'',address:a,rate:+(prompt('Stundensatz','70')||70),channel:prompt('Bevorzugter Kanal: WhatsApp / E-Mail / Post','E-Mail')||'E-Mail'});save();render();toast('Kunde angelegt')}function customerView(){var c=cust(selC),os=db.orders.filter(function(o){return o.customerId==c.id}),is=db.invoices.filter(function(i){return i.customerId==c.id});return'<div class="row" style="justify-content:space-between"><div><h2>'+c.name+'</h2><p class="muted">Kunden-360° · '+c.address+'</p></div><button class="btn primary" onclick="SH.newOrder('+c.id+')">+ Auftrag</button></div><div class="grid g2"><div class="card"><h3>Stammdaten</h3><p>'+c.contact+'<br>'+c.phone+'<br>'+c.email+'<br>'+c.address+'<br>Bevorzugter Versand: <b>'+c.channel+'</b></p></div><div class="card"><h3>Aufträge</h3>'+os.map(function(o){return'<p><b>'+o.no+'</b> '+o.title+' '+badge(o.status)+' <button class="btn" onclick="SH.openReport('+o.id+')">Rapport</button></p>'}).join('')+'</div></div><div class="card"><h3>Rechnungen</h3>'+is.map(function(i){return'<p><button class="btn primary" onclick="SH.openInvoice('+i.id+')">'+i.no+'</button> · '+money(i.gross)+' · '+badge(i.status)+'</p>'}).join('')+'</div>'}function orders(){return'<div class="row" style="justify-content:space-between"><h2>Aufträge</h2><button class="btn primary" onclick="SH.newOrder()">+ Auftrag</button></div>'+db.orders.map(function(o){return'<div class="card"><b>'+o.no+' · '+o.title+'</b><p>'+cust(o.customerId).name+' · '+o.date+' · '+o.assignedTo+' · '+badge(o.status)+'</p><button class="btn primary" onclick="SH.openReport('+o.id+')">Rapport öffnen</button></div>'}).join('')}function newOrder(cid){if(!db.customers.length)return toast('Zuerst Kunde anlegen');var c=cid?cust(cid):db.customers[0],title=prompt('Auftrag für '+c.name);if(!title)return;db.orders.push({id:Date.now(),no:'A-2026-'+String(100+db.orders.length+1),customerId:c.id,title:title,type:prompt('Art','Wartung')||'Wartung',date:new Date().toLocaleDateString('de-DE'),status:'Zugewiesen',assignedTo:'Dome'});save();render();toast('Auftrag angelegt')}function reports(){return'<h2>Rapporte</h2>'+db.reports.map(function(r){var o=ord(r.orderId);return'<div class="card"><b>'+o.no+' · '+cust(o.customerId).name+'</b><p>'+badge(r.status)+'</p><button class="btn primary" onclick="SH.openReport('+o.id+')">Öffnen</button></div>'}).join('')}function reportView(){var o=ord(selO),c=cust(o.customerId),r=repByOrder(o.id);return'<div class="row" style="justify-content:space-between"><div><h2>'+o.no+' · Rapport</h2><p class="muted">'+c.name+' · '+c.address+' · Versand: '+c.channel+'</p></div>'+badge(r.status)+'</div><div class="grid g2"><div class="card"><h3>Einsatz & Arbeiten</h3><button class="btn green" onclick="SH.start()">Einsatz starten</button><button class="btn" onclick="SH.end()">Beenden</button><p>Beginn: '+(r.start||'–')+'<br>Ende: '+(r.end||'–')+'</p><div class="field"><label>Ausgeführte Arbeiten</label><textarea id="work">'+r.work+'</textarea></div><div class="field"><label>Ergebnis / weitere Arbeiten</label><textarea id="result">'+r.result+'</textarea></div><button class="btn" onclick="SH.saveReport()">Speichern</button></div><div class="card"><h3>Leistungen</h3>'+r.lines.map(function(l,n){return'<p>'+l.name+' · '+l.qty+' '+l.unit+' · '+money(l.price)+' <button class="btn" onclick="SH.rmLine('+n+')">×</button></p>'}).join('')+'<button class="btn primary" onclick="SH.addLine()">+ aus Leistungskatalog</button></div></div><div class="grid g2"><div class="card"><h3>Kundenunterschrift</h3><input id="cname" value="'+r.customerName+'"><canvas id="sigC" class="sig"></canvas></div><div class="card"><h3>Technikerunterschrift</h3><p>Dome · Techniker</p><canvas id="sigT" class="sig"></canvas></div></div><div class="sticky row" style="justify-content:space-between"><b>Rapport & Rechnung</b><div class="row"><button class="btn" onclick="SH.printReport()">Rapport PDF</button>'+(r.status==='Abgeschlossen'?'<button class="btn" onclick="SH.sendReport()">Senden: '+c.channel+'</button><button class="btn primary" onclick="SH.makeInvoice()">Rechnung aus Rapport</button>':'')+'<button class="btn primary" onclick="SH.finish()">Rapport abschließen</button></div></div>'}function addLine(){var list=db.settings.catalog.filter(function(x){return x.active!==false}),t=list.map(function(x,n){return(n+1)+': '+x.name+' '+money(x.price)}).join('\n'),k=+(prompt(t,'1')||0)-1;if(k<0||!list[k])return;var x=list[k],r=repByOrder(selO);r.lines.push({id:x.id,name:x.name,unit:x.unit,price:+x.price,qty:+(prompt('Menge / Ist','1')||1)});save();render()}function saveReport(){var r=repByOrder(selO);r.work=q('#work').value;r.result=q('#result').value;r.customerName=q('#cname').value;save();toast('Gespeichert')}function start(){var r=repByOrder(selO);if(!r.start)r.start=new Date().toLocaleString('de-DE');r.status='In Bearbeitung';ord(selO).status='In Bearbeitung';save();render()}function end(){repByOrder(selO).end=new Date().toLocaleString('de-DE');save();render()}function finish(){saveReport();var r=repByOrder(selO);if(!r.start||!r.work)return toast('Beginn und Arbeiten fehlen');r.status='Abgeschlossen';r.end=r.end||new Date().toLocaleString('de-DE');ord(selO).status='Abgeschlossen';save();render();toast('Rapport abgeschlossen')}function makeInvoice(){var r=repByOrder(selO);if(r.status!=='Abgeschlossen')return toast('Rapport zuerst abschließen');for(var z=0;z<db.invoices.length;z++)if(db.invoices[z].reportId==r.id){selI=db.invoices[z].id;tab='invoice';return render()}var o=ord(selO),c=cust(o.customerId),items=r.lines.slice();if(!items.length)items=[{name:o.title,qty:1,unit:'Psch',price:c.rate||70}];var net=0;items.forEach(function(x){net+=x.qty*x.price});var vat=+(net*db.settings.vat/100).toFixed(2),gross=+(net+vat).toFixed(2),due=new Date(Date.now()+db.settings.paymentDays*86400000);var i={id:Date.now(),no:nextInv(),customerId:c.id,orderId:o.id,reportId:r.id,items:items,net:+net.toFixed(2),vat:vat,gross:gross,date:new Date().toLocaleDateString('de-DE'),due:due.toLocaleDateString('de-DE'),status:'Offen',history:[]};db.invoices.push(i);save();selI=i.id;tab='invoice';render();toast('Rechnung '+i.no+' erstellt')}function invoices(){return'<h2>Rechnungen</h2><div class="table card"><table><tr><th>Nr.</th><th>Kunde</th><th>Betrag</th><th>Status</th><th></th></tr>'+db.invoices.map(function(i){return'<tr><td><button class="btn primary" onclick="SH.openInvoice('+i.id+')">'+i.no+'</button></td><td>'+cust(i.customerId).name+'</td><td>'+money(i.gross)+'</td><td><select onchange="SH.status('+i.id+',this.value)">'+['Offen','Versendet','Teilbezahlt','Bezahlt','Überfällig','Storniert'].map(function(s){return'<option '+(i.status===s?'selected':'')+'>'+s+'</option>'}).join('')+'</select></td><td><button class="btn" onclick="SH.openInvoice('+i.id+')">Öffnen</button></td></tr>'}).join('')+'</table></div>'}function invoiceView(){var i=null;db.invoices.forEach(function(x){if(x.id==selI)i=x});var c=cust(i.customerId),o=ord(i.orderId);return'<div class="row" style="justify-content:space-between"><div><h2>Rechnung '+i.no+'</h2><p class="muted">'+c.name+' · Auftrag '+o.no+'</p></div>'+badge(i.status)+'</div><div class="grid g2"><div class="card"><h3>Rechnungsdaten</h3><p>Datum: <b>'+i.date+'</b><br>Fällig: <b>'+i.due+'</b></p><select onchange="SH.status('+i.id+',this.value)">'+['Offen','Versendet','Teilbezahlt','Bezahlt','Überfällig','Storniert'].map(function(s){return'<option '+(i.status===s?'selected':'')+'>'+s+'</option>'}).join('')+'</select><p class="muted">Fehlklick? Status jederzeit wieder auf Offen setzen.</p></div><div class="card"><h3>Empfänger</h3><p>'+c.name+'<br>'+c.address+'<br>'+c.email+'<br>'+c.phone+'<br>Bevorzugt: <b>'+c.channel+'</b></p></div></div><div class="table card"><table><tr><th>Pos.</th><th>Menge</th><th>Einheit</th><th>Bezeichnung</th><th>Einzelpreis</th><th>Gesamt</th></tr>'+i.items.map(function(x,n){return'<tr><td>'+(n+1)+'</td><td>'+x.qty+'</td><td>'+x.unit+'</td><td>'+x.name+'</td><td>'+money(x.price)+'</td><td>'+money(x.qty*x.price)+'</td></tr>'}).join('')+'<tr><td colspan="4"></td><td>Netto</td><td>'+money(i.net)+'</td></tr><tr><td colspan="4"></td><td>19% MwSt.</td><td>'+money(i.vat)+'</td></tr><tr><td colspan="4"></td><td><b>Gesamt</b></td><td><b>'+money(i.gross)+'</b></td></tr></table></div><div class="sticky row" style="justify-content:space-between"><button class="btn" onclick="SH.go(\'invoices\')">Zurück</button><div class="row"><button class="btn" onclick="SH.printInvoice()">PDF / Post</button><button class="btn" onclick="SH.sendInvoice(\'WhatsApp\')">WhatsApp</button><button class="btn" onclick="SH.sendInvoice(\'E-Mail\')">E-Mail</button><button class="btn primary" onclick="SH.sendInvoice(\''+c.channel+'\')">Bevorzugt: '+c.channel+'</button></div></div>'}function status(id,s){db.invoices.forEach(function(i){if(i.id==id){i.history.push({from:i.status,to:s,at:new Date().toLocaleString('de-DE')});i.status=s}});save();render()}function admin(){return'<h2>Administration</h2><div class="card"><div class="row" style="justify-content:space-between"><div><h3>Leistungskatalog</h3><p class="muted">Zentral für Rapport und Rechnung</p></div><button class="btn primary" onclick="SH.addCatalog()">+ Leistung</button></div><div class="table"><table><tr><th>Aktiv</th><th>Bezeichnung</th><th>Einheit</th><th>Preis netto</th><th></th></tr>'+db.settings.catalog.map(function(x){return'<tr><td>'+(x.active?'Ja':'Nein')+'</td><td>'+x.name+'</td><td>'+x.unit+'</td><td>'+money(x.price)+'</td><td><button class="btn" onclick="SH.editCatalog(\''+x.id+'\')">Bearbeiten</button></td></tr>'}).join('')+'</table></div></div>'}function addCatalog(){var n=prompt('Leistung');if(!n)return;db.settings.catalog.push({id:'s'+Date.now(),name:n,unit:prompt('Einheit','Psch')||'Psch',price:+(prompt('Preis netto','0')||0),active:true});save();render()}function editCatalog(id){db.settings.catalog.forEach(function(x){if(x.id===id){x.name=prompt('Bezeichnung',x.name)||x.name;x.unit=prompt('Einheit',x.unit)||x.unit;x.price=+(prompt('Preis netto',x.price)||x.price);x.active=confirm('Leistung aktiv?')}});save();render()}function send(c,label,ch){var text=label+' für '+c.name+' ist bereit.';if(ch==='WhatsApp')window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');else if(ch==='E-Mail')location.href='mailto:'+c.email+'?subject='+encodeURIComponent(label)+'&body='+encodeURIComponent(text);else window.print()}function sendReport(){var o=ord(selO),c=cust(o.customerId);send(c,'Rapport '+o.no,c.channel)}function sendInvoice(ch){var i=null;db.invoices.forEach(function(x){if(x.id==selI)i=x});send(cust(i.customerId),'Rechnung '+i.no,ch)}function printDoc(title,html){var w=window.open('','_blank');if(!w)return toast('Pop-up blockiert');w.document.write('<html><head><meta charset="utf-8"><title>'+title+'</title><style>@page{size:A4;margin:13mm}body{font:12px Arial;color:#111}h1{text-align:center}.head{display:flex;justify-content:space-between}.box{border:1px solid #222;padding:10px}table{width:100%;border-collapse:collapse;margin:14px 0}td,th{border:1px solid #555;padding:6px}.r{text-align:right}.footer{margin-top:35px;font-size:10px;color:#1f4e79}</style></head><body>'+html+'</body></html>');w.document.close();setTimeout(function(){w.print()},350)}function head(){return'<div class="head"><div>Rohrreinigung<br>Notfallservice<br>Grabenlose Rohrsanierung<br>TV- Kanalinspektion<br>Rohrortung<br>Bautrocknung<br>Rückstausicherung</div><div style="text-align:right"><b>Rohr- & Kanaltechnik Winser</b><br>Taläckerstraße 49<br>70437 Stuttgart<br>0152 23401628<br>info@rokatech-winser.de</div></div>'}function foot(){return'<div class="footer">Rohr- & Kanaltechnik Winser · Volksbank Zuffenhausen eG · IBAN DE78 6009 0300 0424 6090 02 · Ust-IdNr. DE456265762</div>'}function printInvoice(){var i=null;db.invoices.forEach(function(x){if(x.id==selI)i=x});var c=cust(i.customerId),o=ord(i.orderId),rows='';i.items.forEach(function(x,n){rows+='<tr><td>'+(n+1)+'</td><td>'+x.qty+'</td><td>'+x.unit+'</td><td>'+x.name+'</td><td class="r">'+money(x.price)+'</td><td class="r">'+money(x.qty*x.price)+'</td></tr>'});printDoc('Rechnung '+i.no,head()+'<div style="display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px"><div><b>'+c.name+'</b><br>'+c.address+'</div><div class="box"><h1>Rechnung</h1><b>Rechnungsnummer: '+i.no+'</b><br><b>Rechnungsdatum: '+i.date+'</b></div></div><p><b>Einsatzort:</b><br>'+c.address+'</p><p><b>Auftrag erteilt:</b> '+c.contact+'<br><b>Rapport:</b> '+o.no+'</p><table><tr><th>Pos.</th><th>Menge</th><th>Einheit</th><th>Bezeichnung</th><th>Einzelpreis</th><th>Gesamtpreis</th></tr>'+rows+'<tr><td colspan="4"></td><td>Summe</td><td>'+money(i.net)+'</td></tr><tr><td colspan="4"></td><td>19% MwSt.</td><td>'+money(i.vat)+'</td></tr><tr><td colspan="4"></td><td><b>Gesamt</b></td><td><b>'+money(i.gross)+'</b></td></tr></table><p><b>Zahlungsbedingung:</b> Zahlbar bis zum '+i.due+' ohne Abzug.<br><i>Bitte geben Sie bei der Zahlung als Verwendungszweck die Rechnungsnummer an.</i></p>'+foot())}function printReport(){var o=ord(selO),c=cust(o.customerId),r=repByOrder(o.id),rows='';db.settings.catalog.forEach(function(x){var l=null;r.lines.forEach(function(y){if(y.id===x.id)l=y});rows+='<tr><td>'+x.name+'</td><td>'+(l?l.qty:'')+'</td><td>'+x.unit+'</td><td>'+money(x.price)+'</td><td>'+(l?money(l.qty*l.price):'')+'</td></tr>'});printDoc('Rapport '+o.no,head()+'<p><b>Auftragsnr.:</b> '+o.no+' &nbsp; <b>Uhrzeit:</b> '+(r.start||'')+' &nbsp; <b>Datum:</b> '+o.date+'</p><table><tr><th></th><th>Auftraggeber</th><th>Einsatzort</th></tr><tr><td>Name</td><td>'+c.name+'</td><td>'+c.contact+'</td></tr><tr><td>Straße</td><td>'+c.address+'</td><td>'+c.address+'</td></tr><tr><td>Telefon</td><td>'+c.phone+'</td><td>'+c.phone+'</td></tr><tr><td>E-Mail</td><td>'+c.email+'</td><td>'+c.email+'</td></tr></table><table><tr><th>Bezeichnung</th><th>Ist</th><th>Einheit</th><th>Preis</th><th>Sind €</th></tr>'+rows+'</table><h3>Ausgeführte Arbeiten</h3><div class="box" style="min-height:100px">'+r.work+'</div><p>☐ Arbeiten beendet &nbsp; ☐ weitere Arbeiten erforderlich</p><p>Hiermit bestätige ich die Richtigkeit der oben genannten Arbeiten. Die AGB auf der Rückseite habe ich gelesen, verstanden und akzeptiere diese.</p><br><br>____________________ &nbsp;&nbsp;&nbsp;&nbsp; ____________________<br>Unterschrift Facharbeiter &nbsp;&nbsp;&nbsp;&nbsp; Unterschrift Kunde'+foot())}function sig(id){var c=document.getElementById(id);if(!c)return;var ctx=c.getContext('2d'),d=false,last;function p(e){var r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top]}function s(e){d=true;last=p(e);e.preventDefault()}function m(e){if(!d)return;var z=p(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(z[0],z[1]);ctx.stroke();last=z;e.preventDefault()}c.onmousedown=s;c.onmousemove=m;c.onmouseup=function(){d=false};c.ontouchstart=s;c.ontouchmove=m;c.ontouchend=function(){d=false}}function render(){if(!session){try{session=JSON.parse(sessionStorage.getItem('shp_session')||'null')}catch(e){}}if(!session)return login();var v;if(tab==='home')v=home();else if(tab==='customers')v=customers();else if(tab==='customer')v=customerView();else if(tab==='orders')v=orders();else if(tab==='reports')v=reports();else if(tab==='report')v=reportView();else if(tab==='invoices')v=invoices();else if(tab==='invoice')v=invoiceView();else v=admin();frame(v);if(tab==='report')setTimeout(function(){sig('sigC');sig('sigT')},50)}window.SH={login:doLogin,logout:logout,go:function(t){tab=t;render()},newCustomer:newCustomer,openCustomer:function(id){selC=id;tab='customer';render()},newOrder:newOrder,openReport:function(id){selO=id;tab='report';render()},addLine:addLine,rmLine:function(n){repByOrder(selO).lines.splice(n,1);save();render()},saveReport:saveReport,start:start,end:end,finish:finish,makeInvoice:makeInvoice,openInvoice:function(id){selI=id;tab='invoice';render()},status:status,addCatalog:addCatalog,editCatalog:editCatalog,sendReport:sendReport,sendInvoice:sendInvoice,printInvoice:printInvoice,printReport:printReport};render()})();</script></body></html>
