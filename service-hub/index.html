<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>Service Hub Pro</title>
<style>html,body{margin:0;min-height:100%;background:#f4f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;color:#10263a}.boot div{text-align:center}.boot b{display:block;font-size:22px;margin-bottom:8px}.boot span{color:#687887}</style>
</head>
<body>
<div class="boot"><div><b>Service Hub Pro</b><span>App wird geladen …</span></div></div>
<script>
(async function(){
  try{
    var version='20260830-v9-1';
    var dialogsVersion='20260903-v9-2';
    var documentsVersion='20260903-v9-5';
    var dashboardVersion='20260903-v9-4';
    var crmSearchVersion='20260904-v10';
    var navigationVersion='20260904-v10-nav1';
    var res=await fetch('./legacy.html?v='+version,{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    var html=await res.text();
    html=html.replace('var db=load();','var db=load();try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){}');
    html=html.replace("no:'A-2026-'+String(100+db.orders.length+1)","no:(function(){var max=100;db.orders.forEach(function(o){var m=String(o.no||'').match(/^A-\\d{4}-(\\d+)$/),n=m?parseInt(m[1],10):NaN;if(!isNaN(n)&&n>max)max=n});return 'A-'+new Date().getFullYear()+'-'+('0000'+(max+1)).slice(-4)})()");
    html=html.replace('</head>','<link rel="stylesheet" href="./ux-v5.css?v='+version+'"><link rel="stylesheet" href="./ux-v6.css?v='+documentsVersion+'"><link rel="stylesheet" href="./ux-v6-context.css?v='+version+'"><link rel="stylesheet" href="./ux-v9-dashboard.css?v='+dashboardVersion+'"><link rel="stylesheet" href="./ux-v10-customer-search.css?v='+crmSearchVersion+'"><link rel="stylesheet" href="./ux-v10-navigation.css?v='+navigationVersion+'"></head>');
    var patch='<scr'+'ipt src="./core.js?v='+version+'"></scr'+'ipt><scr'+'ipt src="./ux-v5.js?v='+version+'"></scr'+'ipt><scr'+'ipt src="./ux-v6.js?v='+documentsVersion+'"></scr'+'ipt><scr'+'ipt src="./ux-v6-context.js?v='+version+'"></scr'+'ipt><scr'+'ipt src="./ux-v6-admin-route.js?v='+version+'"></scr'+'ipt><scr'+'ipt src="./auth-v7.js?v='+version+'"></scr'+'ipt><scr'+'ipt src="./ux-v9-live-surface.js?v='+version+'"></scr'+'ipt><scr'+'ipt src="./ux-v9-dialogs.js?v='+dialogsVersion+'"></scr'+'ipt><scr'+'ipt src="./ux-v9-invoice-logo.js?v='+documentsVersion+'"></scr'+'ipt><scr'+'ipt src="./ux-v9-dashboard.js?v='+dashboardVersion+'"></scr'+'ipt><scr'+'ipt src="./ux-v10-customer-search.js?v='+crmSearchVersion+'"></scr'+'ipt><scr'+'ipt src="./ux-v10-navigation.js?v='+navigationVersion+'"></scr'+'ipt>';
    html=html.replace('</body>',patch+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="boot"><div><b>Service Hub Pro konnte nicht geladen werden</b><span>Bitte Seite neu laden.</span></div></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
