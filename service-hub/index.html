<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>Service Hub Pro</title>
<style>html,body{margin:0;min-height:100%;background:#f4f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;color:#10263a}.boot div{text-align:center}.boot b{display:block;font-size:22px;margin-bottom:8px}.boot span{color:#687887}</style>
</head>
<body>
<div class="boot"><div><b>Service Hub Pro</b><span>App wird geladen …</span></div></div>
<script>
(async function(){
  try{
    var res=await fetch('./legacy.html?v=20260820',{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    var html=await res.text();
    html=html.replace('</head>','<link rel="stylesheet" href="./ux-v4.css?v=20260820"></head>');
    var patch='<scr'+'ipt src="./ux-v4.js?v=20260820"></scr'+'ipt>';
    html=html.replace('</body>',patch+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="boot"><div><b>Service Hub Pro konnte nicht geladen werden</b><span>Bitte Seite neu laden.</span></div></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
