<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Service Hub Pro</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#13283a;background:#f4f7fa;--n:#0b1f33;--b:#1769cf;--g:#08795b;--r:#b83434;--l:#dbe4ec;--m:#657482;--amber:#a96a00}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f7fa}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:var(--n);color:#fff;padding:13px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:20px;font-weight:800}.shell{max-width:1280px;margin:auto;padding:18px}.nav,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:0;border-radius:10px;padding:10px 13px;background:#e8eef4;color:#142333;font-weight:700}.primary{background:var(--b);color:#fff}.green{background:var(--g);color:#fff}.red{background:var(--r);color:#fff}.amber{background:#fff1d9;color:#764900}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:16px;box-shadow:0 3px 14px #0b1f330d;margin-bottom:12px}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.metric b{font-size:28px;display:block}.muted{color:var(--m)}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:5px}input,textarea,select{width:100%;padding:10px;border:1px solid #cad6e0;border-radius:10px;font:inherit;background:#fff}textarea{min-height:95px;resize:vertical}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8eef4;font-size:12px;font-weight:800}.ok{background:#ddf3e9;color:#086047}.bad{background:#fde2e2;color:#912626}.warn{background:#fff0d6;color:#8b5d00}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:9px;border-bottom:1px solid var(--l);text-align:left;vertical-align:top}.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(145deg,#081827,#173e62)}.loginbox{width:min(500px,100%);background:#fff;border-radius:22px;padding:25px;box-shadow:0 24px 70px #0005}.sig{height:145px;width:100%;border:2px dashed #b8c6d2;border-radius:11px;touch-action:none;background:#fff}.sticky{position:sticky;bottom:10px;background:#fff;border:1px solid var(--l);border-radius:14px;padding:10px;box-shadow:0 8px 25px #0013}.mobile{display:none}.toast{position:fixed;right:15px;bottom:15px;background:#122333;color:#fff;padding:11px 14px;border-radius:10px;z-index:99;max-width:90vw}.hero{padding:18px;border-radius:16px;background:linear-gradient(135deg,#0b1f33,#1769cf);color:#fff;margin-bottom:14px}.steps{display:flex;gap:7px;overflow:auto;margin:10px 0}.step{white-space:nowrap;background:#e8eef4;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.doc{background:#fff;color:#111;border:1px solid #ccc;max-width:900px;margin:0 auto;padding:28px}.doc h1,.doc h2,.doc h3{margin-top:0}.doc-head{display:grid;grid-template-columns:1fr 1fr;gap:20px}.doc-company{text-align:right}.doc-table{width:100%;border-collapse:collapse}.doc-table th,.doc-table td{border:1px solid #999;padding:7px;vertical-align:top}.doc-total{margin-left:auto;width:330px}.small{font-size:12px}.right{text-align:right}.history{font-size:12px;border-left:3px solid #dbe4ec;padding-left:10px}.kpi{font-size:12px;color:var(--m)}
@media(max-width:850px){.g2,.g3,.g4{grid-template-columns:1fr}.shell{padding:12px 12px 82px}.desktop{display:none}.mobile{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--n);padding:7px calc(7px + env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) calc(7px + env(safe-area-inset-left));justify-content:space-around;z-index:30}.mobile button{background:none;border:0;color:#fff;font-size:12px}.table table{min-width:690px}.doc{padding:15px}.doc-head{grid-template-columns:1fr}.doc-company{text-align:left}.doc-total{width:100%}.sticky{bottom:68px}}
@media print{body{background:#fff}.top,.mobile,.btn,.no-print,.toast{display:none!important}.shell{padding:0;max-width:none}.card{box-shadow:none}.doc{border:0;max-width:none;padding:0}.print-break{page-break-before:always}.doc-table{font-size:11px}}
</style>
</head>
<body>
<div id="app">Lade Service Hub Pro…</div>
<script>
(function(){
var PASS='Demo-2026!',STORE='shp_db',SESSION='shp_session',app=document.getElementById('app');
var tab='home',selectedCustomer=null,selectedOrder=null,selectedInvoice=null,session=null,viewMode='app';
var defaultCatalog=[{id:'svc1',name:'Gerätewageneinsatz (inkl. 1 Techniker)',unit:'Std.',price:125,active:true},{id:'svc2',name:'2. Techniker',unit:'Std.',price:80,active:true},{id:'svc3',name:'Einsatz Hochdruckspüler (je angefangene Std)',unit:'Std.',price:90,active:true},{id:'svc4',name:'TV- Kanaluntersuchung (je angefangene Std)',unit:'Std.',price:80,active:true},{id:'svc5',name:'TV- Kanaluntersuchung inkl. Kanalortung (je angefangene Std)',unit:'Std.',price:120,active:true},{id:'svc6',name:'Aufzeichnung TV-Kanaluntersuchung (USB Stick)',unit:'Stk.',price:45,active:true},{id:'svc7',name:'Notdienstzulage 75% (Mo-Fr 18-8 Uhr, Samstag)',unit:'Std.',price:93.75,active:true},{id:'svc8',name:'Notdienstzulage 100% (Sonn-/Feiertag)',unit:'Std.',price:125,active:true},{id:'svc9',name:'Anfahrt',unit:'Psch',price:20,active:true},{id:'svc10',name:'Verbrauchsmaterialien',unit:'Psch',price:0,active:true}];
var seed={customers:[{id:1,name:'Musterkunde Stuttgart GmbH',contact:'Thomas Berger',phone:'0711 555123',email:'t.berger@example.de',address:'Industriestraße 18, 70469 Stuttgart',hourlyRate:72,preferredChannel:'WhatsApp',priceOverrides:{},serviceInterval:'12 Monate',nextService:'2027-08-08'}],orders:[{id:101,no:'A-2026-0101',customerId:1,title:'Wartung Heizungsanlage',type:'Wartung',date:'08.08.2026',status:'Zugewiesen',assignedTo:'Dome'}],reports:[{id:501,orderId:101,status:'Entwurf',start:'',end:'',work:'',result:'',lines:[],materials:[],measurements:[],photos:[],customerName:'Thomas Berger',sigC:'',sigT:'',payment:'Rechnung wird verschickt',sentHistory:[]}],invoices:[{id:801,no:'26175',customerId:1,orderId:101,reportId:null,items:[{catalogId:'svc1',name:'Gerätewageneinsatz (inkl. 1 Techniker)',qty:1,unit:'Std.',price:125},{catalogId:'svc9',name:'Anfahrt',qty:1,unit:'Psch',price:20}],net:145,vat:27.55,gross:172.55,date:'26.05.2026',due:'26.06.2026',status:'Offen',history:[{at:'26.05.2026',by:'System',text:'Rechnung angelegt'}],sentHistory:[]}],settings:{vat:19,paymentDays:30,defaultHourlyRate:70,catalog:defaultCatalog,audit:[]}};
function clone(x){return JSON.parse(JSON.stringify(x))}function now(){return new Date().toLocaleString('de-DE')}function dateDE(){return new Date().toLocaleDateString('de-DE')}
function load(){var d=null;try{d=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}if(!d||!d.customers)d=clone(seed);if(!d.reports&&d.protocols)d.reports=d.protocols;if(!d.reports)d.reports=[];if(!d.settings)d.settings={};if(!d.settings.catalog||!d.settings.catalog.length)d.settings.catalog=clone(defaultCatalog);if(!d.settings.vat)d.settings.vat=19;if(!d.settings.paymentDays)d.settings.paymentDays=30;if(!d.settings.defaultHourlyRate)d.settings.defaultHourlyRate=70;if(!d.settings.audit)d.settings.audit=[];if(!d.invoices)d.invoices=[];if(!d.orders)d.orders=[];var i,c,r,iv;for(i=0;i<d.customers.length;i++){c=d.customers[i];if(c.hourlyRate==null)c.hourlyRate=c.rate!=null?c.rate:d.settings.defaultHourlyRate;if(!c.preferredChannel)c.preferredChannel=c.channel||'E-Mail';if(!c.priceOverrides)c.priceOverrides={};if(!c.serviceInterval)c.serviceInterval='';if(!c.nextService)c.nextService=''}for(i=0;i<d.reports.length;i++){r=d.reports[i];if(!r.lines)r.lines=[];if(!r.materials)r.materials=[];if(!r.measurements)r.measurements=[];if(!r.photos)r.photos=[];if(!r.sentHistory)r.sentHistory=[];if(!r.payment)r.payment='Rechnung wird verschickt'}for(i=0;i<d.invoices.length;i++){iv=d.invoices[i];if(!/^26\d{3}$/.test(String(iv.no||'')))iv.no=String(26175+i*5);if(!iv.history)iv.history=[];if(!iv.sentHistory)iv.sentHistory=[];if(!iv.items)iv.items=[];if(iv.gross==null)iv.gross=+iv.amount||0;if(iv.net==null)iv.net=+(iv.gross/(1+d.settings.vat/100)).toFixed(2);if(iv.vat==null)iv.vat=+(iv.gross-iv.net).toFixed(2)}return d}
var db=load();try{session=JSON.parse(sessionStorage.getItem(SESSION)||'null')}catch(e){}
function save(){localStorage.setItem(STORE,JSON.stringify(db))}function q(s){return document.querySelector(s)}function esc(s){s=String(s==null?'':s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function money(v){return(+v||0).toFixed(2).replace('.',',')+' €'}function toast(t){var e=document.createElement('div');e.className='toast';e.innerHTML=t;document.body.appendChild(e);setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e)},1900)}
function param(name){var s=location.search.replace(/^\?/,'').split('&'),i,p;for(i=0;i<s.length;i++){p=s[i].split('=');if(decodeURIComponent(p[0]||'')===name)return decodeURIComponent((p[1]||'').replace(/\+/g,' '))}return''}
function cust(id){var i;for(i=0;i<db.customers.length;i++)if(db.customers[i].id==id)return db.customers[i];return null}function ord(id){var i;for(i=0;i<db.orders.length;i++)if(db.orders[i].id==id)return db.orders[i];return null}function invoice(id){var i;for(i=0;i<db.invoices.length;i++)if(db.invoices[i].id==id)return db.invoices[i];return null}
function reportByOrder(id){var i,r,o,c;for(i=0;i<db.reports.length;i++)if(db.reports[i].orderId==id)return db.reports[i];o=ord(id);c=cust(o.customerId);r={id:Date.now(),orderId:id,status:'Entwurf',start:'',end:'',work:'',result:'',lines:[],materials:[],measurements:[],photos:[],customerName:c.contact||c.name,sigC:'',sigT:'',payment:'Rechnung wird verschickt',sentHistory:[]};db.reports.push(r);save();return r}
function badge(s){var c=/bezahlt|abgeschlossen|erledigt/i.test(s)?'ok':/überfällig|storniert/i.test(s)?'bad':'warn';return'<span class="badge '+c+'">'+esc(s)+'</span>'}function audit(text){db.settings.audit.unshift({at:now(),by:session?session.user:'System',text:text});if(db.settings.audit.length>100)db.settings.audit.length=100;save()}function nextInvoiceNo(){var m=26170,i,n;for(i=0;i<db.invoices.length;i++){n=parseInt(db.invoices[i].no,10);if(!isNaN(n)&&n>m)m=n}return String(m+5)}function catalogItem(id){var i;for(i=0;i<db.settings.catalog.length;i++)if(db.settings.catalog[i].id===id)return db.settings.catalog[i];return null}function customerPrice(customerId,catalogId){var c=cust(customerId),it=catalogItem(catalogId),v;if(!it)return 0;if(c&&c.priceOverrides&&c.priceOverrides[catalogId]!=null&&c.priceOverrides[catalogId]!==''){v=parseFloat(c.priceOverrides[catalogId]);if(!isNaN(v))return v}return +it.price||0}
function loginView(){var role=param('role'),u=role==='dome'?'dome':role==='annette'?'annette':role==='admin'?'admin':'';app.innerHTML='<div class="login"><div class="loginbox"><h1 style="margin-bottom:4px">Service Hub Pro</h1><p class="muted">Rohr- & Kanaltechnik Winser</p><div class="field"><label>Benutzer</label><input id="u" value="'+esc(u)+'"></div><div class="field"><label>Passwort</label><input id="p" type="password" value="'+(u?PASS:'')+'"></div><button class="btn primary" style="width:100%" onclick="SH.login()">Anmelden</button><p class="muted small">dome / annette / admin · Demo-2026!</p></div></div>'}function doLogin(){var u=q('#u').value.toLowerCase();if(['dome','annette','admin'].indexOf(u)<0||q('#p').value!==PASS)return toast('Zugangsdaten prüfen');session={user:u,role:u==='dome'?'tech':u==='admin'?'admin':'office'};sessionStorage.setItem(SESSION,JSON.stringify(session));tab='home';render()}function logout(){sessionStorage.removeItem(SESSION);session=null;render()}
function frame(x){var office=session.role!=='tech';var nav=office?'<button class="btn" onclick="SH.go(\'home\')">Übersicht</button><button class="btn" onclick="SH.go(\'customers\')">Kunden</button><button class="btn" onclick="SH.go(\'orders\')">Aufträge</button><button class="btn" onclick="SH.go(\'reports\')">Rapporte</button><button class="btn" onclick="SH.go(\'invoices\')">Rechnungen</button>'+(session.role==='admin'?'<button class="btn" onclick="SH.go(\'admin\')">Administration</button>':''):'<button class="btn" onclick="SH.go(\'home\')">Meine Einsätze</button><button class="btn" onclick="SH.go(\'reports\')">Rapporte</button>';app.innerHTML='<header class="top"><div><div class="brand">Service Hub Pro</div><small>'+(session.user==='dome'?'Dome · Techniker':session.user==='annette'?'Annette · Büro':'Administration')+'</small></div><div class="nav desktop">'+nav+'<button class="btn" onclick="SH.logout()">Abmelden</button></div></header><main class="shell">'+x+'</main><nav class="mobile"><button onclick="SH.go(\'home\')">⌂<br>Start</button><button onclick="SH.go(\'reports\')">✓<br>Rapporte</button>'+(office?'<button onclick="SH.go(\'customers\')">👤<br>Kunden</button><button onclick="SH.go(\'invoices\')">€<br>Rechnung</button>':'')+'<button onclick="SH.logout()">↪<br>Logout</button></nav>'}
function homeView(){var mine,html;if(session.role==='tech'){mine=db.orders.filter(function(o){return o.assignedTo==='Dome'});html='<div class="row between"><div><h2>Meine Einsätze</h2><div class="muted">Kunde → Auftrag → Rapport</div></div></div>';html+=mine.map(function(o){var c=cust(o.customerId);return'<div class="card"><div class="row between"><div><b>'+esc(o.no)+' · '+esc(o.title)+'</b><p class="muted">'+esc(c.name)+'<br>'+esc(c.address)+'<br>'+esc(o.date)+'</p></div><div>'+badge(o.status)+'<br><button class="btn primary" onclick="SH.openReport('+o.id+')">Rapport öffnen</button></div></div></div>'}).join('');return html}return'<div class="hero"><h2 style="margin-top:0">Büro-Dashboard</h2><p>Ein gemeinsamer Datenfluss: Kunde → Auftrag → Rapport → Rechnung → Versand → Zahlung.</p></div><div class="grid g4"><div class="card metric"><span>Kunden</span><b>'+db.customers.length+'</b></div><div class="card metric"><span>Aufträge</span><b>'+db.orders.length+'</b></div><div class="card metric"><span>Rapporte</span><b>'+db.reports.length+'</b></div><div class="card metric"><span>Rechnungen</span><b>'+db.invoices.length+'</b></div></div>'}
function customersView(){var html='<div class="row between"><div><h2>Kunden</h2><div class="muted">Kundenspezifische Preise werden in Administration gepflegt.</div></div><button class="btn primary" onclick="SH.newCustomer()">+ Kunde</button></div>';html+=db.customers.map(function(c){var n=db.orders.filter(function(o){return o.customerId==c.id}).length;return'<div class="card"><div class="row between"><div><b>'+esc(c.name)+'</b><p>'+esc(c.contact)+' · '+esc(c.phone)+'<br>'+esc(c.email)+'<br>'+esc(c.address)+'<br>Bevorzugter Kanal: <b>'+esc(c.preferredChannel)+'</b> · '+n+' Aufträge</p></div><button class="btn primary" onclick="SH.openCustomer('+c.id+')">360° öffnen</button></div></div>'}).join('');return html}
function newCustomer(){var n=prompt('Kundenname');if(!n)return;var a=prompt('Adresse');if(!a)return;var id=Date.now();db.customers.push({id:id,name:n,contact:prompt('Ansprechpartner')||'',phone:prompt('Telefon')||'',email:prompt('E-Mail')||'',address:a,hourlyRate:+(prompt('Stundensatz für diesen Kunden',String(db.settings.defaultHourlyRate))||db.settings.defaultHourlyRate),preferredChannel:prompt('Bevorzugter Kanal: WhatsApp / E-Mail / Post','E-Mail')||'E-Mail',priceOverrides:{},serviceInterval:'',nextService:''});save();audit('Kunde '+n+' angelegt');selectedCustomer=id;tab='customer';render()}
function customerView(){var c=cust(selectedCustomer),os,is;if(!c)return customersView();os=db.orders.filter(function(o){return o.customerId==c.id});is=db.invoices.filter(function(i){return i.customerId==c.id});return'<div class="row between"><div><h2>'+esc(c.name)+'</h2><p class="muted">Kunden-360° · '+esc(c.address)+'</p></div><div class="row"><button class="btn" onclick="SH.editCustomer('+c.id+')">Stammdaten bearbeiten</button><button class="btn primary" onclick="SH.newOrder('+c.id+')">+ Auftrag</button></div></div><div class="grid g3"><div class="card"><h3>Kontakt</h3><p>'+esc(c.contact)+'<br>'+esc(c.phone)+'<br>'+esc(c.email)+'<br>'+esc(c.address)+'</p></div><div class="card"><h3>Konditionen</h3><p>Stundensatz: <b>'+money(c.hourlyRate)+'/h</b><br>Preisabweichungen: <b>'+Object.keys(c.priceOverrides||{}).length+'</b></p><button class="btn" onclick="SH.goAdminCustomer('+c.id+')">In Administration bearbeiten</button></div><div class="card"><h3>Kommunikation</h3><p>Bevorzugt: <b>'+esc(c.preferredChannel)+'</b><br>Serviceintervall: '+esc(c.serviceInterval||'–')+'<br>Nächster Service: '+esc(c.nextService||'–')+'</p></div></div><div class="card"><div class="row between"><h3>Aufträge</h3><button class="btn primary" onclick="SH.newOrder('+c.id+')">+ Auftrag</button></div>'+os.map(function(o){return'<p><b>'+esc(o.no)+'</b> '+esc(o.title)+' · '+badge(o.status)+' <button class="btn" onclick="SH.openReport('+o.id+')">Rapport</button></p>'}).join('')+'</div><div class="card"><h3>Rechnungen</h3>'+is.map(function(i){return'<p><button class="btn primary" onclick="SH.openInvoice('+i.id+')">'+esc(i.no)+'</button> · '+money(i.gross)+' · '+badge(i.status)+'</p>'}).join('')+'</div>'}
function editCustomer(id){var c=cust(id),x;x=prompt('Kundenname',c.name);if(x!==null&&x!=='')c.name=x;x=prompt('Ansprechpartner',c.contact);if(x!==null)c.contact=x;x=prompt('Telefon',c.phone);if(x!==null)c.phone=x;x=prompt('E-Mail',c.email);if(x!==null)c.email=x;x=prompt('Adresse',c.address);if(x!==null)c.address=x;x=prompt('Bevorzugter Kanal: WhatsApp / E-Mail / Post',c.preferredChannel);if(x!==null&&x!=='')c.preferredChannel=x;x=prompt('Serviceintervall, z.B. 12 Monate',c.serviceInterval||'');if(x!==null)c.serviceInterval=x;x=prompt('Nächster Service YYYY-MM-DD',c.nextService||'');if(x!==null)c.nextService=x;save();audit('Stammdaten '+c.name+' geändert');render()}
function ordersView(){return'<div class="row between"><h2>Aufträge</h2><button class="btn primary" onclick="SH.newOrder()">+ Auftrag</button></div>'+db.orders.map(function(o){var c=cust(o.customerId);return'<div class="card"><div class="row between"><div><b>'+esc(o.no)+' · '+esc(o.title)+'</b><p>'+esc(c.name)+' · '+esc(o.date)+' · '+esc(o.assignedTo)+' · '+badge(o.status)+'</p></div><button class="btn primary" onclick="SH.openReport('+o.id+')">Rapport öffnen</button></div></div>'}).join('')}
function newOrder(cid){if(!db.customers.length)return toast('Zuerst Kunde anlegen');var c=cid?cust(cid):db.customers[0],title=prompt('Auftrag für '+c.name);if(!title)return;var id=Date.now();db.orders.push({id:id,no:'A-2026-'+String(100+db.orders.length+1),customerId:c.id,title:title,type:prompt('Art','Wartung')||'Wartung',date:dateDE(),status:'Zugewiesen',assignedTo:'Dome'});save();audit('Auftrag '+title+' für '+c.name+' angelegt');selectedOrder=id;tab='report';render()}
function reportsView(){return'<h2>Rapporte</h2><p class="muted">Dome und Annette öffnen exakt dieselbe Rapportansicht.</p>'+db.reports.map(function(r){var o=ord(r.orderId),c=o?cust(o.customerId):null;if(!o||!c)return'';return'<div class="card"><div class="row between"><div><b>'+esc(o.no)+' · '+esc(o.title)+'</b><p>'+esc(c.name)+' · '+badge(r.status)+'</p></div><button class="btn primary" onclick="SH.openReport('+o.id+')">Rapport öffnen</button></div></div>'}).join('')}

function normalPhone(p){return String(p||'').replace(/[^0-9]/g,'').replace(/^0/,'49')}function recordSend(kind,id,channel){var x=kind==='invoice'?invoice(id):reportByOrder(id),arr=x.sentHistory||[];arr.push({at:now(),by:session.user,channel:channel});x.sentHistory=arr;save();audit((kind==='invoice'?'Rechnung ':'Rapport ')+(kind==='invoice'?x.no:ord(id).no)+' Versand über '+channel)}
function sendChannel(kind,id,channel){var o,c,docNo,msg,subject,phone;if(kind==='invoice'){var iv=invoice(id);o=ord(iv.orderId);c=cust(iv.customerId);docNo='Rechnung '+iv.no;msg='Guten Tag '+(c.contact||c.name)+', hier erhalten Sie '+docNo+' zu Auftrag '+(o?o.no:'')+'. Bitte beachten Sie das Dokument/PDF.';subject=docNo+' - Rohr- & Kanaltechnik Winser'}else{o=ord(id);c=cust(o.customerId);docNo='Rapport '+o.no;msg='Guten Tag '+(c.contact||c.name)+', hier erhalten Sie den Rapport zu Auftrag '+o.no+'. Bitte beachten Sie das Dokument/PDF.';subject=docNo+' - Rohr- & Kanaltechnik Winser'}recordSend(kind,id,channel);if(channel==='WhatsApp'){phone=normalPhone(c.phone);location.href='https://wa.me/'+phone+'?text='+encodeURIComponent(msg)}else if(channel==='E-Mail'){location.href='mailto:'+encodeURIComponent(c.email||'')+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(msg)}else{if(kind==='invoice'){selectedInvoice=id;viewMode='printInvoice'}else{selectedOrder=id;viewMode='printReport'}render();setTimeout(function(){window.print()},200)}}function sendReportPreferred(){var o=ord(selectedOrder),c=cust(o.customerId);sendChannel('report',selectedOrder,c.preferredChannel)}function sendInvoicePreferred(){var iv=invoice(selectedInvoice),c=cust(iv.customerId);sendChannel('invoice',selectedInvoice,c.preferredChannel)}function sendInvoice(ch){sendChannel('invoice',selectedInvoice,ch)}
function adminView(){var cat=db.settings.catalog,custHtml=db.customers.map(function(c){return'<div class="card"><div class="row between"><div><b>'+esc(c.name)+'</b><div class="muted">Stundensatz '+money(c.hourlyRate)+'/h · bevorzugt '+esc(c.preferredChannel)+'</div></div><button class="btn primary" onclick="SH.editCustomerPricing('+c.id+')">Konditionen bearbeiten</button></div></div>'}).join('');return'<div class="row between"><div><h2>Administration</h2><div class="muted">Zentrale Leistungen, Preise und kundenspezifische Konditionen.</div></div></div><div class="grid g2"><div class="card"><h3>Globale Einstellungen</h3><div class="field"><label>Standard-Stundensatz €/h</label><input id="adr" type="number" value="'+esc(db.settings.defaultHourlyRate)+'"></div><div class="field"><label>Mehrwertsteuer %</label><input id="avat" type="number" value="'+esc(db.settings.vat)+'"></div><div class="field"><label>Zahlungsziel Tage</label><input id="adays" type="number" value="'+esc(db.settings.paymentDays)+'"></div><button class="btn primary" onclick="SH.saveAdminGlobal()">Speichern</button></div><div class="card"><h3>Änderungshistorie</h3><div class="history">'+db.settings.audit.slice(0,12).map(function(h){return'<p><b>'+esc(h.at)+'</b> · '+esc(h.by)+'<br>'+esc(h.text)+'</p>'}).join('')+'</div></div></div><div class="card"><div class="row between"><h3>Leistungskatalog</h3><button class="btn primary" onclick="SH.addCatalogItem()">+ Leistung</button></div><div class="table"><table><tr><th>Aktiv</th><th>Bezeichnung</th><th>Einheit</th><th>Standardpreis</th><th></th></tr>'+cat.map(function(it){return'<tr><td>'+(it.active!==false?'Ja':'Nein')+'</td><td>'+esc(it.name)+'</td><td>'+esc(it.unit)+'</td><td>'+money(it.price)+'</td><td><button class="btn" onclick="SH.editCatalogItem(\''+it.id+'\')">Bearbeiten</button></td></tr>'}).join('')+'</table></div></div><div style="font-size:18px;font-weight:800;margin:18px 0 8px">Kundenkonditionen</div>'+custHtml}
function saveAdminGlobal(){db.settings.defaultHourlyRate=+(q('#adr').value||0);db.settings.vat=+(q('#avat').value||19);db.settings.paymentDays=+(q('#adays').value||30);save();audit('Globale Einstellungen geändert');toast('Gespeichert')}function addCatalogItem(){var n=prompt('Bezeichnung');if(!n)return;var id='svc'+Date.now();db.settings.catalog.push({id:id,name:n,unit:prompt('Einheit','Std.')||'Std.',price:+(prompt('Standardpreis','0')||0),active:true});save();audit('Leistung '+n+' angelegt');render()}function editCatalogItem(id){var it=catalogItem(id),x;if(!it)return;x=prompt('Bezeichnung',it.name);if(x!==null&&x!=='')it.name=x;x=prompt('Einheit',it.unit);if(x!==null&&x!=='')it.unit=x;x=prompt('Standardpreis',String(it.price));if(x!==null&&!isNaN(parseFloat(x)))it.price=parseFloat(x);it.active=confirm('Leistung aktiv lassen? OK=aktiv, Abbrechen=inaktiv');save();audit('Leistung '+it.name+' geändert');render()}
function editCustomerPricing(id){var c=cust(id),x,i,it,cur;x=prompt('Stundensatz €/h für '+c.name,String(c.hourlyRate));if(x!==null&&!isNaN(parseFloat(x)))c.hourlyRate=parseFloat(x);x=prompt('Bevorzugter Kommunikationskanal: WhatsApp / E-Mail / Post',c.preferredChannel);if(x!==null&&x!=='')c.preferredChannel=x;for(i=0;i<db.settings.catalog.length;i++){it=db.settings.catalog[i];cur=c.priceOverrides[it.id]!=null?c.priceOverrides[it.id]:'';x=prompt(it.name+'\nStandard: '+money(it.price)+'\nKundenpreis leer = Standard verwenden',String(cur));if(x===null)continue;if(x==='')delete c.priceOverrides[it.id];else if(!isNaN(parseFloat(x)))c.priceOverrides[it.id]=parseFloat(x)}save();audit('Kundenkonditionen '+c.name+' geändert');render()}function goAdminCustomer(id){selectedCustomer=id;tab='admin';render();setTimeout(function(){editCustomerPricing(id)},100)}function backApp(){viewMode='app';render()}function go(t){tab=t;selectedInvoice=null;if(t!=='customer')selectedCustomer=null;if(t!=='report')selectedOrder=null;viewMode='app';render()}
function render(){if(viewMode==='printReport')return app.innerHTML=printReportView();if(viewMode==='printInvoice')return app.innerHTML=printInvoiceView();if(!session)return loginView();var v;if(tab==='home')v=homeView();else if(tab==='customers')v=customersView();else if(tab==='customer')v=customerView();else if(tab==='orders')v=ordersView();else if(tab==='reports')v=reportsView();else if(tab==='report')v=reportView();else if(tab==='invoices')v=invoicesView();else if(tab==='invoice')v=invoiceView();else v=adminView();frame(v);if(tab==='report')setTimeout(function(){var r=reportByOrder(selectedOrder);signaturePad('sigC',r.sigC);signaturePad('sigT',r.sigT)},60)}
window.SH={login:doLogin,logout:logout,go:go,newCustomer:newCustomer,openCustomer:function(id){selectedCustomer=id;tab='customer';render()},editCustomer:editCustomer,newOrder:newOrder,openReport:openReport,saveReportText:saveReportText,startReport:startReport,endReport:endReport,addReportLine:addReportLine,removeReportLine:removeReportLine,addMaterial:addMaterial,removeMaterial:removeMaterial,addMeasurement:addMeasurement,removeMeasurement:removeMeasurement,clearSig:clearSig,finishReport:finishReport,printReport:printReport,invoiceFromReport:invoiceFromReport,openInvoice:openInvoice,saveInvoiceStatus:saveInvoiceStatus,printInvoice:printInvoice,sendReportPreferred:sendReportPreferred,sendInvoicePreferred:sendInvoicePreferred,sendInvoice:sendInvoice,saveAdminGlobal:saveAdminGlobal,addCatalogItem:addCatalogItem,editCatalogItem:editCatalogItem,editCustomerPricing:editCustomerPricing,goAdminCustomer:goAdminCustomer,backApp:backApp};render();
})();
