<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Wohnraumnachweis – Abdullah Bayram Tayar</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f2f4f7;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#111}
main{max-width:880px;margin:auto;padding:12px} .card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 6px 22px #0001}
h1{font-size:22px;margin:0 0 8px} h2{font-size:18px;margin:0 0 12px} p{line-height:1.4}
input,button{width:100%;padding:14px;font-size:17px;border-radius:11px;margin:6px 0} input{border:1px solid #c7ccd3} button{border:0;background:#111;color:white;font-weight:800}
button.alt{background:#e9edf1;color:#111} .hide{display:none} .err{color:#b00020;font-weight:700} .sub{color:#667;font-size:14px}
#sig{width:100%;height:190px;border:2px dashed #9aa3ad;border-radius:12px;touch-action:none;background:#fff}
#formCanvas{width:100%;height:auto;border:1px solid #d6dbe0;background:white} .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.row{grid-template-columns:1fr} main{padding:8px}}
</style></head>
<body><main>
<section id="login" class="card">
<h1>Wohnraumnachweis</h1><p class="sub">Abdullah Bayram Tayar</p>
<label>Benutzername</label><input id="user" autocomplete="username" autocapitalize="none">
<label>Passwort</label><input id="pass" type="password" autocomplete="current-password">
<button id="loginBtn">Anmelden</button><div id="loginErr" class="err"></div>
</section>

<div id="app" class="hide">
<section class="card"><h1>Wohnraumnachweis – Abdullah Bayram Tayar</h1>
<p><b>Taläckerstr. 51, 70437 Stuttgart</b></p><p class="sub">Nur dieses Dokument ist in der App enthalten.</p></section>

<section class="card"><h2>1. Ort und Datum</h2>
<div class="row"><div><label>Ort</label><input id="place" value="Stuttgart"></div><div><label>Datum</label><input id="date" type="date"></div></div>
</section>

<section class="card"><h2>2. Unterschrift</h2><canvas id="sig"></canvas>
<div class="row"><button id="clear" class="alt">Unterschrift löschen</button><button id="refresh">Vorschau aktualisieren</button></div>
<p class="sub">Mit Finger oder Stift unterschreiben.</p></section>

<section class="card"><h2>3. Vorschau</h2><canvas id="formCanvas" width="1240" height="1754"></canvas>
<button id="pdf">PDF erstellen</button></section>
</div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const USER='seref', PASSHASH='ff0f4253b72d8c72400529e6383c5178483d2444d77004053c5d386788e5cca7';
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
loginBtn.onclick=async()=>{loginErr.textContent='';if(user.value.trim().toLowerCase()!==USER || await sha256(pass.value)!==PASSHASH){loginErr.textContent='Benutzername oder Passwort falsch.';return}login.classList.add('hide');app.classList.remove('hide');setupSig();drawForm()};

date.value=new Date().toISOString().slice(0,10);
const s=sig, sx=s.getContext('2d'); let down=false, ink=false;
function setupSig(){const r=s.getBoundingClientRect(),d=window.devicePixelRatio||1;s.width=r.width*d;s.height=r.height*d;sx.setTransform(d,0,0,d,0,0);sx.lineWidth=2.6;sx.lineCap='round';sx.lineJoin='round';sx.strokeStyle='#111'}
function pt(e){const r=s.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return [t.clientX-r.left,t.clientY-r.top]}
function start(e){e.preventDefault();down=true;const q=pt(e);sx.beginPath();sx.moveTo(q[0],q[1])} function move(e){if(!down)return;e.preventDefault();const q=pt(e);sx.lineTo(q[0],q[1]);sx.stroke();ink=true} function end(){down=false}
['mousedown','touchstart'].forEach(v=>s.addEventListener(v,start,{passive:false}));['mousemove','touchmove'].forEach(v=>s.addEventListener(v,move,{passive:false}));['mouseup','mouseleave','touchend','touchcancel'].forEach(v=>s.addEventListener(v,end,{passive:false}));
clear.onclick=()=>{sx.clearRect(0,0,s.width,s.height);ink=false;drawForm()}; refresh.onclick=drawForm; place.oninput=drawForm; date.onchange=drawForm;
function fd(){if(!date.value)return'';const [y,m,d]=date.value.split('-');return d+'.'+m+'.'+y}
function line(ctx,x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function text(ctx,t,x,y,size=25,bold=false){ctx.font=(bold?'700 ':'')+size+'px Arial';ctx.fillText(t,x,y)}
function drawForm(){
 const c=formCanvas,ctx=c.getContext('2d'),W=c.width,H=c.height;ctx.fillStyle='white';ctx.fillRect(0,0,W,H);ctx.fillStyle='#111';ctx.strokeStyle='#111';ctx.lineWidth=2;
 text(ctx,'Landeshauptstadt Stuttgart',100,90,23);text(ctx,'Amt für öffentliche Ordnung',100,120,23);text(ctx,'Ausländerbehörde',100,150,23);text(ctx,'Eberhardstr. 39',100,180,23);text(ctx,'70173 Stuttgart',100,210,23);
 text(ctx,'STUTTGART',760,120,54,true); text(ctx,'Wohnraumnachweis bei einer Eigentumswohnung',100,300,34,true);
 text(ctx,'Zur weiteren Prüfung in einer ausländerrechtlichen Angelegenheit benötigen wir einen Nachweis',100,355,22);text(ctx,'darüber, dass ausreichend Wohnraum zur Verfügung steht. Wir bitten Sie daher, die nachstehende',100,386,22);text(ctx,'Bestätigung auszufüllen und zu unterschreiben.',100,417,22);
 ctx.fillStyle='#eee';ctx.fillRect(100,465,1040,82);ctx.fillStyle='#111';text(ctx,'Bei der Berechnung der Wohnfläche werden Nebenräume wie z. B. Küche, Bad, WC und Flur',115,500,21);text(ctx,'mitberücksichtigt. Nicht berücksichtigt werden können Keller, Dachboden und Abstellräume.',115,530,21);
 text(ctx,'Bestätigung',100,620,27,true);text(ctx,'Eigentumswohnung',100,670,27,true);
 text(ctx,'PLZ, Ort',100,735,20);line(ctx,100,750,530,750);text(ctx,'70437 Stuttgart',120,790,28);
 text(ctx,'Straße',680,735,20);line(ctx,680,750,1120,750);text(ctx,'Taläckerstr. 51',700,790,28);
 text(ctx,'Anzahl der Wohnräume',100,835,20);line(ctx,100,850,530,850);text(ctx,'3',150,892,30);
 text(ctx,'Darlehen',680,835,20);line(ctx,680,850,870,850);text(ctx,'700',735,892,30);text(ctx,'Euro / Monat',890,892,24);
 text(ctx,'Größe in m²',100,935,20);line(ctx,100,950,530,950);text(ctx,'60',145,992,30);
 text(ctx,'Hausgeld',680,935,20);line(ctx,680,950,870,950);text(ctx,'Euro / Monat',890,992,24);
 text(ctx,'Anzahl der Personen, die die Wohnung ständig',100,1035,20);text(ctx,'bewohnen',100,1062,20);line(ctx,100,1080,530,1080);text(ctx,'2',150,1122,30);
 text(ctx,'Nebenkosten',680,1035,20);line(ctx,680,1050,870,1050);text(ctx,'100',730,1092,30);text(ctx,'Euro / Monat',890,1092,24);
 text(ctx,'Eigentümer',100,1180,28,true);
 text(ctx,'Name, Vorname',100,1240,20);line(ctx,100,1255,540,1255);text(ctx,'Tayar, Abdullah Bayram',115,1295,27);
 text(ctx,'Straße',100,1340,20);line(ctx,100,1355,540,1355);text(ctx,'Taläckerstr. 51',115,1395,27);
 text(ctx,'PLZ, Wohnort',100,1440,20);line(ctx,100,1455,540,1455);text(ctx,'70437 Stuttgart',115,1495,27);
 text(ctx,'Telefon',100,1540,20);line(ctx,100,1555,540,1555);
 text(ctx,'Ort, Datum',600,1240,20);line(ctx,600,1255,1120,1255);text(ctx,(place.value||'Stuttgart')+', '+fd(),620,1295,27);
 text(ctx,'Unterschrift',600,1340,20);line(ctx,600,1410,1120,1410);
 if(ink){const im=new Image();im.onload=()=>ctx.drawImage(im,620,1325,440,85);im.src=s.toDataURL('image/png')}
 ctx.strokeRect(90,1600,1060,90);text(ctx,'Bitte noch bei Wohneigentum Kaufvertrag und Nachweise über Darlehensraten, Nebenkosten und',105,1640,20);text(ctx,'Hausgeld vorlegen.',105,1670,20);
}
pdf.onclick=()=>{if(!ink)return alert('Bitte zuerst unterschreiben.');drawForm();setTimeout(()=>{const {jsPDF}=window.jspdf,p=new jsPDF({unit:'mm',format:'a4'});p.addImage(formCanvas.toDataURL('image/jpeg',.95),'JPEG',0,0,210,297);p.save('Wohnraumnachweis_Abdullah_Bayram_Tayar.pdf')},120)};
</script></body></html>
